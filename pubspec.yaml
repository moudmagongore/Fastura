name: fastura
description: "Fastura — application mobile de facturation multi-tenant"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management, DI et routage
  get: ^4.7.3
  get_storage: ^2.1.1

  # Backend V1 — Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Format et i18n (fr_FR, montants, dates)
  intl: ^0.20.2

  # Affichage du logo du tenant (en-tête, paramètres)
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
